<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Responder al casero</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --border: #dcdcd6; --accent: #2457c5; --accent-text: #ffffff; --ok: #1d7a3e; --warn: #9a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --text: #ececea; --muted: #a2a29c;
      --border: #3a3a36; --accent: #6f9bff; --accent-text: #0e1220; --ok: #5fd08a; --warn: #f0b45a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: .9rem; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
  }
  label { display: block; font-size: .8rem; font-weight: 600; color: var(--muted);
          text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  input, textarea {
    width: 100%; font: inherit; color: var(--text); background: transparent;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  }
  textarea { min-height: 60vh; resize: vertical; font-size: 15px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  button, a.btn {
    font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 16px;
    background: var(--accent); color: var(--accent-text); cursor: pointer; text-decoration: none;
  }
  a.btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .status { font-size: .9rem; color: var(--ok); }
  .slots { font-size: .9rem; color: var(--warn); }
  .slots.done { color: var(--ok); }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  .error {
    border: 1px solid var(--warn); color: var(--warn); border-radius: 12px;
    padding: 14px; margin-bottom: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
</style>
</head>
<body>
<main>
  <noscript><div class="error">Esta página necesita JavaScript.</div></noscript>
  <div id="error" class="error" hidden></div>
  <div id="empty" class="empty" hidden>Enlace sin datos.</div>
  <div id="app" hidden>
    <h1>Responder al casero</h1>

    <div class="row" style="margin: 0 0 14px">
      <a class="btn secondary" id="open" href="#" target="_blank" rel="noopener noreferrer">Abrir anuncio</a>
    </div>

    <div class="card">
      <label for="subject">Asunto</label>
      <input id="subject" type="text">
      <div class="row">
        <button type="button" data-copy="subject">Copiar asunto</button>
        <span class="status" data-status="subject"></span>
      </div>
    </div>

    <div class="card">
      <label for="body">Mensaje</label>
      <textarea id="body" spellcheck="false"></textarea>
      <div class="row">
        <button type="button" data-copy="body">Copiar mensaje</button>
        <span class="status" data-status="body"></span>
        <span class="slots" id="slots"></span>
      </div>
    </div>
  </div>
</main>
<script>
// Cualquier fallo se muestra en pantalla: la página nunca queda en blanco.
function showError(msg) {
  var el = document.getElementById("error");
  el.textContent = "Error: " + msg;
  el.hidden = false;
}
window.addEventListener("error", function (ev) {
  showError((ev.message || "error desconocido") + (ev.lineno ? " (línea " + ev.lineno + ")" : ""));
});

function decode(fragment) {
  var b64 = fragment.replace(/-/g, "+").replace(/_/g, "/");
  while (b64.length % 4) b64 += "=";
  var bin = atob(b64);
  var bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(bytes));
}

try { init(); } catch (e) { showError(e && e.message ? e.message : String(e)); }

function init() {
  var frag = location.hash.slice(1);
  if (!frag) {
    document.getElementById("empty").hidden = false;
    return;
  }

  var data;
  try {
    data = decode(frag);
  } catch (e) {
    throw new Error("no se pudo leer el enlace (¿está cortado?). " + e.message);
  }
  if (!data || typeof data.b !== "string") {
    throw new Error("el enlace no contiene un mensaje.");
  }

  document.getElementById("app").hidden = false;

  var subject = document.getElementById("subject");
  var body = document.getElementById("body");
  var slots = document.getElementById("slots");
  var open = document.getElementById("open");

  subject.value = data.s || "";
  body.value = data.b;

  if (data.u && /^https?:\/\//i.test(data.u)) open.href = data.u;
  else open.hidden = true;

  function countSlots() {
    var n = ((subject.value + "\n" + body.value).match(/\[[^\]\n]*\]/g) || []).length;
    slots.textContent = n ? "Quedan " + n + " huecos [ ]" : "Sin huecos pendientes";
    slots.className = n ? "slots" : "slots done";
  }
  subject.addEventListener("input", countSlots);
  body.addEventListener("input", countSlots);
  countSlots();

  function fallbackCopy(el) {
    el.focus(); el.select();
    try { return document.execCommand("copy"); } catch (e) { return false; }
  }

  document.querySelectorAll("[data-copy]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var id = btn.getAttribute("data-copy");
      var el = document.getElementById(id);
      var status = document.querySelector('[data-status="' + id + '"]');
      function done(ok) {
        status.textContent = ok ? "Copiado" : "No se pudo copiar: selecciona y copia a mano";
        setTimeout(function () { status.textContent = ""; }, 2500);
      }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(el.value).then(function () { done(true); },
          function () { done(fallbackCopy(el)); });
      } else {
        done(fallbackCopy(el));
      }
    });
  });
}
</script>
</body>
</html>
